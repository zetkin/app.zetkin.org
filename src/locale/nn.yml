            paragraphPart2:
              state: UPDATED
              text: Vi har gleden av å invitere deg til et panel om 1. Mai
            paragraphPart3:
              state: UPDATED
              text: 'Her er hva du kan forvente:'
          paragraph:
            paragraph1:
              state: UPDATED
              text: Et spøkelse er på ferde i Europa - kommunismens spøkelse. Alle makter i
                det gamle Europa har forent seg til en hellig hetsjakt motdette
                spøkelse - paven og tsaren, Metternich og Guizot, franske
                radikale og tysk politi.
            paragraph2:
              state: UPDATED
              text: Hvor fins det opposisjonsparti som ikke er blitt skjelt ut for å være
                kommunistisk av sine regjerende motstandere, - hvor fins det
                opposisjonsparti som ikke har slynget denne brennemerkende
                klander tilbake både mot mer fremskredne opposisjonfolk og mot
                sine reaksjonære motstandere?
            paragraph3:
              state: UPDATED
              text: To slutninger kan en trekke av denne kjensgjerning.
            paragraph4:
              state: UPDATED
              text: Kommunismen annerkjennes allerede av alle europeiske makter som en makt.
            paragraph5:
              state: UPDATED
              text: Det er på tide at kommunistene åpent legger fram for hele verden sitt syn,
                sine mål, sine tendenser. og stiller et manifest fra partiet
