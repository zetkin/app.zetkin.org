            paragraphPart3: 'Voici ce qui vous attend :'
          paragraph:
            paragraph1: "Un spectre hante l'Europe : le spectre du communisme. Toutes les
              puissances de la vieille Europe se sont unies en une
              sainte-alliance pour exorciser ce spectre : le pape et le tsar,
              Metternich et Guizot, les radicaux français et les mouchards de la
              police allemande."
            paragraph2: Quel est le parti d'opposition qui n'a pas été taxé de communisme
              par ses adversaires au pouvoir ? Quelle est l'opposition qui, à
              son tour, n'a pas renvoyé l'accusation infamante de communisme aux
              partis d'opposition plus avancés comme à ses adversaires
              réactionnaires ?
            paragraph3: 'Il en résulte deux choses :'
            paragraph4: Le communisme est déjà reconnu par toutes les puissances européennes
              comme une puissance à part entière.
            paragraph5: Il est grand temps que les communistes exposent ouvertement, à la
              face du monde entier, leurs conceptions, leurs buts et leurs
              tendances, et qu'ils opposent à cette légende du spectre du
              communisme un manifeste du parti lui-même.
            paragraph6: 'Pour lire le manifeste en entier, cliquez '
            paragraph7: ici
