name: Build docker image

on:
  push:
    branches:
      - 'release'

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx is necessary for GitHub Actions caching to work
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        id: release-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          release_date="$(date -u +%y%m%d)"

          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            package_endpoint="/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions"
          else
            package_endpoint="/users/$OWNER/packages/container/$PACKAGE_NAME/versions"
          fi

          latest_subversion="$({
            gh api --paginate "$package_endpoint?per_page=100" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null || true
          } | sed -n "s/^${release_date}\.\([0-9][0-9]*\)$/\1/p" \
            | sort -n \
            | tail -1)"

          if [[ -z "$latest_subversion" ]]; then
            next_subversion=0
          else
            next_subversion=$((latest_subversion + 1))
          fi

          echo "version=${release_date}.${next_subversion}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The image will be tagged YYMMDD and YYMMDD-abcdef,
          # where abcdef is the shortform hash of the last commit
          tags: |
            type=sha,prefix=${{ steps.release-version.outputs.version }}-
            type=raw,value=${{ steps.release-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./env/frontend/Dockerfile
          push: true
          build-args: |
            ZETKIN_APP_VERSION=${{ steps.release-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
